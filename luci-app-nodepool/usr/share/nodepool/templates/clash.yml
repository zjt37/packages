mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
NODES

proxy-groups:
  - name: 国外
    type: select
    proxies:
      - 自动选择
NAMES
  - name: opencode
    type: select
    proxies:
      - 台港新自动
      - 其他自动
NAMES
  - name: AI
    type: select
    proxies:
      - 台新自动
      - 其他自动
NAMES
  - name: TikTok
    type: select
    proxies:
      - 港新自动
      - 其他自动
NAMES
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
NAMES
  - name: 台港新自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    url: http://www.gstatic.com/generate_204
    filter: "(?=.*(香港|HK|Hong ?Kong|台湾|TW|Taiwan|新加坡|SG|Singapore|加坡)).*$"
  - name: 台新自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    url: http://www.gstatic.com/generate_204
    filter: "(?=.*(台湾|TW|Taiwan|新加坡|SG|Singapore|加坡)).*$"
  - name: 港新自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    url: http://www.gstatic.com/generate_204
    filter: "(?=.*(香港|HK|Hong ?Kong|新加坡|SG|Singapore|加坡)).*$"
  - name: 其他自动
    type: url-test
    include-all: true
    exclude-filter: "香港|HK|Hong ?Kong|台湾|TW|Taiwan|新加坡|SG|Singapore|加坡"
    tolerance: 50
    interval: 300
    url: http://www.gstatic.com/generate_204
NAMES
  - name: 国内
    type: select
    proxies:
      - DIRECT
