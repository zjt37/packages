# SMART 智能模板：核心分组使用 mihomo 的 smart 类型（模型自动选最优节点）
# 注意：需要支持 smart 的内核（mihomo 新版/OpenClash 智能内核等），普通老内核会报未知类型错误
# policy-priority 可选：QualityFirst(质量优先) / Laser(极速) / RoundRobin(轮询)
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
NODES

proxy-groups:
  # 智能选点：内核按延迟/丢包自动挑最合适的节点并自动切换
  - name: 智能选择
    type: smart
    policy-priority: QualityFirst
    collect-data: false
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
NAMES
  # 手动画圈：想自己指定就用这个
  - name: 手动选择
    type: select
    proxies:
      - 智能选择
      - DIRECT
NAMES
  - name: 国外媒体
    type: select
    proxies:
      - 智能选择
      - 手动选择
      - DIRECT
  - name: AI服务
    type: select
    proxies:
      - 智能选择
      - 手动选择
NAMES
  - name: 电报消息
    type: select
    proxies:
      - 智能选择
      - 手动选择
  - name: 兜底分流
    type: select
    proxies:
      - 智能选择
      - 手动选择
      - DIRECT

rules:
  # ===== 局域网 =====
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  # ===== Telegram =====
  - DOMAIN-SUFFIX,telegram.org,电报消息
  - DOMAIN-SUFFIX,t.me,电报消息
  - DOMAIN-SUFFIX,tdesktop.com,电报消息
  - IP-CIDR,91.108.4.0/22,电报消息,no-resolve
  - IP-CIDR,91.108.8.0/22,电报消息,no-resolve
  - IP-CIDR,149.154.160.0/20,电报消息,no-resolve
  # ===== AI 服务 =====
  - DOMAIN-SUFFIX,openai.com,AI服务
  - DOMAIN-SUFFIX,chatgpt.com,AI服务
  - DOMAIN-SUFFIX,claude.ai,AI服务
  - DOMAIN-SUFFIX,gemini.google.com,AI服务
  - DOMAIN-SUFFIX,copilot.microsoft.com,AI服务
  # ===== 流媒体 =====
  - DOMAIN-SUFFIX,youtube.com,国外媒体
  - DOMAIN-SUFFIX,googlevideo.com,国外媒体
  - DOMAIN-SUFFIX,netflix.com,国外媒体
  - DOMAIN-KEYWORD,netflix,国外媒体
  - DOMAIN-SUFFIX,twitch.tv,国外媒体
  - DOMAIN-SUFFIX,spotify.com,国外媒体
  # ===== 国内直连 =====
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - GEOIP,CN,DIRECT
  # ===== 兜底 =====
  - MATCH,兜底分流
