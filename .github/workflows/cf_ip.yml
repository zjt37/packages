name: 更新CF优选IP

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-cf-ip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script
        run: python3 scripts/cf_ip.py

      - name: Commit and push
        run: |
          git config user.name "zjt37"
          git config user.email "27096491@qq.com"
          git add cf_ips.txt
          if git diff --cached --quiet; then
            echo "No changes, skip"
          else
            git commit -m "Update CF IPs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Delete this run
        if: always()
        run: |
          curl -s -X DELETE \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
