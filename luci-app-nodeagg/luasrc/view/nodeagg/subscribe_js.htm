<script type="text/javascript">
//<![CDATA[
function confirmDeleteNode(remark) {
	if (!confirm("<%:删除订阅节点%>: " + remark + " ?"))
		return false;
	alert("<%:删除订阅节点%>: " + remark);
	return false;
}

function confirmDeleteAll() {
	if (!confirm("<%:确定要删除所有订阅节点吗？%>"))
		return false;
	alert("<%:删除所有订阅节点%>");
	return false;
}

function ManualSubscribe(sectionId) {
	var urlInput = document.querySelector("input[name='cbid.nodeagg." + sectionId + ".url']");
	var currentUrl = urlInput ? urlInput.value.trim() : "";
	if (!currentUrl) {
		alert("<%:订阅地址不能为空%>");
		return;
	}
	alert("<%:手动订阅%>: " + currentUrl);
}

function ManualSubscribeAll() {
	var sectionIds = [];
	var urls = [];
	var table = document.getElementById("cbi-nodeagg-subscribe_list");
	var editBtns = table ? table.getElementsByClassName("cbi-button cbi-button-edit") : [];
	for (var i = 0; i < editBtns.length; i++) {
		var btn = editBtns[i];
		var onclickStr = btn.getAttribute("onclick");
		if (!onclickStr) continue;
		var id = onclickStr.substring(onclickStr.lastIndexOf('/') + 1, onclickStr.length - 1);
		if (!id) continue;
		var urlInput = document.querySelector("input[name='cbid.nodeagg." + id + ".url']");
		var currentUrl = urlInput ? urlInput.value.trim() : "";
		if (!currentUrl) {
			alert("<%:订阅地址不能为空%>");
			return;
		}
		sectionIds.push(id);
		urls.push(currentUrl);
	}
	if (sectionIds.length === 0) {
		return;
	}
	alert("<%:手动订阅所有%>: " + urls.join(", "));
}
//]]>
</script>
